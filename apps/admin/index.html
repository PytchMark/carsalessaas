<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dealer Admin</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/app.css" />
</head>
<body>
  <div id="app">
    <div id="loginView" class="card">
      <div class="brand">
        <div class="brand-badge">D</div>
        <div>
          <div class="brand-title">Dealer Admin</div>
          <div class="brand-sub">Inventory manager</div>
        </div>
      </div>

      <h1 class="h1">Sign in</h1>
      <p class="muted">Use your dealerId + PIN.</p>

      <label class="label">Dealer ID</label>
      <input id="dealerId" class="input" placeholder="dlr_demo" />

      <label class="label">PIN</label>
      <input id="pin" class="input" placeholder="1234" type="password" />

      <div class="row">
        <button id="loginBtn" class="btn primary">Sign in</button>
      </div>
      <div id="loginStatus" class="status"></div>
    </div>

    <div id="dashView" class="card hidden">
      <div class="topbar">
        <div>
          <div class="pill"><span class="dot"></span><span id="dealerName">Dealer</span></div>
          <div class="h2">Inventory</div>
          <div class="muted" id="dealerMeta"></div>
        </div>
        <div class="actions">
          <button id="newVehicleBtn" class="btn primary">＋ Add vehicle</button>
          <button id="refreshBtn" class="btn ghost">⟳ Refresh</button>
        </div>
      </div>

      <div class="filters">
        <input id="search" class="input" placeholder="Search title, make, model…" />
        <select id="statusFilter" class="select">
          <option value="">All</option>
          <option>Draft</option>
          <option>Published</option>
          <option>Sold</option>
        </select>
        <button id="applyFilters" class="btn ghost">Apply</button>
      </div>

      <div class="kpis">
        <div class="kpi"><div class="kpi-label">Total</div><div id="kpiTotal" class="kpi-val">–</div></div>
        <div class="kpi"><div class="kpi-label">Published</div><div id="kpiPub" class="kpi-val">–</div></div>
        <div class="kpi"><div class="kpi-label">Draft</div><div id="kpiDraft" class="kpi-val">–</div></div>
      </div>

      <div class="tableShell">
        <div class="tableHead">
          <div class="h3">Vehicles</div>
          <div id="tableStatus" class="muted">Ready.</div>
        </div>
        <div class="tableScroll">
          <table>
            <thead>
              <tr>
                <th>Vehicle</th>
                <th>Price</th>
                <th>Status</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="vehiclesTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div id="modalBackdrop" class="backdrop hidden">
      <div class="modal">
        <div class="modalTop">
          <div>
            <div class="h3" id="modalTitle">New vehicle</div>
            <div class="muted">Create or update a vehicle listing.</div>
          </div>
          <button id="modalClose" class="iconBtn">×</button>
        </div>

        <div class="grid">
          <div>
            <label class="label">Title</label>
            <input id="vTitle" class="input" placeholder="2018 Toyota Corolla" />
          </div>
          <div>
            <label class="label">Status</label>
            <select id="vStatus" class="select">
              <option>Draft</option>
              <option>Published</option>
              <option>Sold</option>
            </select>
          </div>
          <div>
            <label class="label">Make</label>
            <input id="vMake" class="input" placeholder="Toyota" />
          </div>
          <div>
            <label class="label">Model</label>
            <input id="vModel" class="input" placeholder="Corolla" />
          </div>
          <div>
            <label class="label">Year</label>
            <input id="vYear" class="input" placeholder="2018" type="number" />
          </div>
          <div>
            <label class="label">Price</label>
            <input id="vPrice" class="input" placeholder="1650000" type="number" />
          </div>
        </div>

        <div>
          <label class="label">Notes</label>
          <textarea id="vNotes" class="textarea" placeholder="Condition, features, issues…"></textarea>
        </div>

        <div class="uploadRow">
          <input id="fileInput" type="file" multiple />
          <button id="uploadBtn" class="btn ghost">Upload media</button>
          <div class="muted" id="uploadStatus"></div>
        </div>

        <div class="row right">
          <button id="modalCancel" class="btn ghost">Cancel</button>
          <button id="modalSave" class="btn primary">Save</button>
        </div>

        <div id="modalStatus" class="status"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"><span id="toastMsg"></span></div>
  </div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
